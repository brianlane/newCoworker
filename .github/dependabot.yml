version: 2

# The render sidecar's npm `playwright` pin and its Docker base image
# (mcr.microsoft.com/playwright:v<x.y.z>-jammy) MUST move in the same PR: the
# image ships the browser binaries the library looks for, and a mismatch is a
# LATENT outage that only detonates on the next container rebuild (bit twice:
# PR #226, then Dependabot #1005 whose mismatch took the render box down on
# 2026-07-31 during a routine redeploy). This group makes Dependabot bump both
# in ONE PR so tests/aiflow-render-playwright-pin.test.ts passes and automerge
# can proceed. Do NOT split these back into separate npm/docker entries: two
# separate PRs each fail the pin guard until the other lands, which deadlocks
# automerge.
multi-ecosystem-groups:
  aiflow-render:
    schedule:
      interval: weekly

updates:
  # Root Next.js app
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # @napi-rs/wasm-runtime 1.2.0 peers @emnapi/core@^2.0.0-alpha.3 while
      # root optionalDependencies still pin @emnapi/core to the 1.x line, so
      # grouped minor/patch bumps of both fail `npm ci` with ERESOLVE (see
      # PR #1007). Unignore once the @emnapi 2.x line is stable and can be
      # adopted together.
      - dependency-name: "@napi-rs/wasm-runtime"

  - package-ecosystem: npm
    directory: "/cloudflare/email-worker"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/vps/llm-router"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/vps/chat-worker"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/vps/voice-bridge"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # No @google/genai major-version pin: the bridge now runs on the 2.x line.
    # The 2.0 breaking changes were Interactions-API only, the Gemini Live API
    # (ai.live.connect / sendRealtimeInput) and generateContent are unaffected
    # per the v2.0.0 changelog, and the bridge builds + runs against 2.x. (The
    # "calls die after the greeting" outage was the odd-length PCM bug, #259,
    # not the SDK major.) Major bumps now flow as their own PRs for review.

  # Both members of the aiflow-render multi-ecosystem group (see the header
  # comment). The group owns the schedule; `patterns` is required on members
  # and ["*"] takes every dependency, so majors ride the group PR too, which
  # is exactly when the base image matters most. The docker side tracks the
  # FROM tag in vps/aiflow-render/Dockerfile.
  - package-ecosystem: npm
    directory: "/vps/aiflow-render"
    patterns: ["*"]
    multi-ecosystem-group: "aiflow-render"

  - package-ecosystem: docker
    directory: "/vps/aiflow-render"
    patterns: ["*"]
    multi-ecosystem-group: "aiflow-render"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
