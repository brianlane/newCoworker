name: CI

on:
  pull_request:
  push:
    branches: [main]
  # cursor-automerge.yml squash-merges with GITHUB_TOKEN, which does not
  # emit a push event. After a successful merge it dispatches this
  # workflow on main so migrations and production Vercel still run.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "true"
  # Production deploy (migrations + Vercel --prod + IndexNow). push to
  # main is the normal path. workflow_dispatch on main is the Cloud Agent
  # automerge path: GITHUB_TOKEN squash-merges do not create a push run.
  MAIN_DEPLOY: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://mock.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: mock_anon_key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Dependency hygiene: fails on packages that are declared but never
      # imported, and on packages that are imported but never declared (the
      # two gaps behind PR #1181: an SDK nobody imported shipped for a full
      # release cycle, and @modelcontextprotocol/server was imported by three
      # files while resolving only as another package's peer). Scope and
      # ignores live in knip.json; sub-trees (vps/, cloudflare/, zapier/,
      # supabase Deno functions) are out of scope.
      - name: Dependency hygiene (knip)
        run: npm run knip

      # Dead-export ratchet: knip again in --production mode, where an export
      # whose only caller is a test counts as UNUSED. That class is how dead
      # money-code stayed "alive" through the 100% coverage pin twice in 2026
      # (a test written to cover a dead export makes it look used). Fails on
      # any finding not in .github/knip-exports-baseline.txt; the baseline
      # self-destructs when too many entries go stale. Details in
      # scripts/knip-exports-ratchet.mjs.
      - name: Dead-export ratchet (knip --production)
        run: npm run knip:exports

      - name: Build
        run: npm run build

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://mock.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: mock_anon_key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      # The repo-root tsconfig EXCLUDES vps/voice-bridge (it is its own package
      # with its own deps and compiler), so nothing above typechecks the bridge.
      # Its `tsc` runs inside the Docker build instead, which means a type error
      # there passes every CI gate, merges, and only surfaces when
      # redeploy-voice-bridge fails on the boxes: on 2026-08-17 that took the
      # whole 4-box fleet sweep with it, AFTER the merge, leaving main green and
      # the fix not live. The bridge is the only vps package with its own tsc,
      # so this one step closes the gap.
      - name: Typecheck voice-bridge (the compiler its Docker build runs)
        working-directory: vps/voice-bridge
        run: |
          npm ci --ignore-scripts
          npx tsc --noEmit

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore

  deno-check:
    name: Edge Functions Typecheck (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.3

      # The repo-root `tsc --noEmit` EXCLUDES supabase/functions (it can't resolve
      # the Deno https:// URL imports), so app typecheck can't catch missing
      # exports / type breakage in the edge functions, exactly the class of bug
      # that boot-crashed ai-flow-worker in prod. `deno check` on each entrypoint
      # transitively type-checks the function and its _shared deps the same way
      # the Supabase CLI bundles them at deploy.
      #
      # --node-modules-dir=none: the functions import supabase-js via an npm:
      # specifier (esm.sh's 522s failed two main deploys, Jul 22-23 2026), and
      # the repo-root package.json would otherwise flip Deno into byonm mode
      # and demand the package in node_modules: this job never npm-installs.
      # "none" resolves npm: from Deno's global cache, matching the deploy
      # container (which sees no package.json at all).
      - name: Type-check Supabase Edge functions
        run: deno check --node-modules-dir=none supabase/functions/*/index.ts

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (prod deps, high+, allowlist-aware)
        # Same allowlist-aware wrapper as audit.yml; see scripts/audit-with-allowlist.mjs.
        run: node scripts/audit-with-allowlist.mjs --omit=dev

  # The REAL ai-flow-worker against a REAL local Postgres: `supabase start`
  # applies every migration (which keeps the migration ledger honest: the
  # duplicate-version drift this job's first run exposed broke local starts
  # repo-wide), `supabase functions serve` runs the actual worker bundle, and
  # the suite ticks it over HTTP exactly like pg_cron. Covers what the unit
  # and live-AI layers cannot: run claiming/reclaim, revision bumps,
  # wait_for_reply park + timeout RPCs, sleep deferrals, step persistence.
  worker-integration:
    name: Worker Integration (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [quality, typecheck, test, deno-check, security]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pinned: `latest` (2.109.x) changed the `supabase status` output keys
      # and handed the suite a non-service key ("permission denied for table
      # businesses" on the first CI run). 2.78.1 is the version the suite was
      # validated against locally; bump deliberately, not implicitly.
      #
      # The pin no longer covers GRANTS. A newer CLI also builds the schema
      # without the Data API grants the pre-convention tables used to get
      # automatically, which produced the SAME "permission denied" text from a
      # completely different cause; the schema now states those grants itself
      # (20260821004100_backfill_service_role_grants.sql) and the suite's
      # preflight names the failure. So this pin is about `supabase status`
      # output only, and bumping it is now a small, checkable change.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.78.1

      - name: Start local Supabase (applies all migrations)
        run: supabase start -x studio,imgproxy,mailpit,realtime,storage-api

      - name: Serve edge functions
        run: |
          # The sms-reply-pipeline suite runs a fake Rowboat (port 8977) on
          # THIS host; the edge-runtime container reaches it via the supabase
          # docker network's gateway IP (Linux). Locally on Docker Desktop
          # the same role is played by host.docker.internal: see the
          # vitest.worker-integration.config.ts header for the local recipe.
          NET=supabase_network_glwmorjxzkzpcfffwvkk
          GW=$(docker network inspect "$NET" -f '{{(index .IPAM.Config 0).Gateway}}' 2>/dev/null || true)
          if [ -z "$GW" ]; then
            # Some docker versions omit Gateway from IPAM, so derive the host
            # address as .1 of the network's subnet (docker's convention).
            SUBNET=$(docker network inspect "$NET" -f '{{(index .IPAM.Config 0).Subnet}}' 2>/dev/null || true)
            GW=$(printf '%s' "$SUBNET" | sed -E 's#\.[0-9]+/[0-9]+$#.1#')
          fi
          [ -z "$GW" ] && GW=host.docker.internal
          echo "fake-rowboat host for containers: $GW"
          {
            echo "INTERNAL_CRON_SECRET=itest-cron-secret"
            echo "ROWBOAT_CHAT_URL_TEMPLATE=http://${GW}:8977/chat"
            echo "ROWBOAT_DEFAULT_PROJECT_ID=itest-project"
            echo "ROWBOAT_VPS_CHAT_BEARER=itest-rowboat-bearer"
            # The calendly-booking-goal-gap suite runs a fake platform app
            # (port 8978) for the worker's pre-send booking precheck; the
            # per-tick email/calendar poll kicks answer 200 there too.
            echo "AIFLOW_PLATFORM_URL=http://${GW}:8978"
            # sms-reply-short-links suite: the shortener needs a base URL
            # (short by design so bare-domain URLs still shorten in tests),
            # and the fake app doubles as the Telnyx API so the DELIVERED
            # reply body is assertable. Businesses that seed no
            # business_telnyx_settings profile still dead-letter at
            # missing_telnyx_messaging_env (no global profile id is set).
            echo "NEXT_PUBLIC_APP_URL=https://ncw.example"
            echo "TELNYX_API_KEY=itest-telnyx-key"
            echo "TELNYX_API_BASE=http://${GW}:8978"
            # international-sms-skip suite: the fake app also stands in for
            # Resend so the untextable-lead email fallback's DELIVERED body is
            # assertable. Every flow email in the suite lands here, never at
            # the real host.
            echo "RESEND_API_KEY=itest-resend-key"
            echo "RESEND_API_BASE=http://${GW}:8978"
          } > supabase/functions/.env.itest
          # --no-verify-jwt mirrors production: every function is deployed
          # with verify_jwt = false (see supabase/config.toml) because they
          # authenticate their own callers (the pg_cron bearer is plain hex,
          # not a JWT, the gateway check rejects it with "Invalid Token").
          (supabase functions serve --no-verify-jwt --env-file supabase/functions/.env.itest > /tmp/functions-serve.log 2>&1 &)
          # Ready when the worker answers (401 = up, auth working; retry ~60s).
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:54321/functions/v1/ai-flow-worker || true)
            if [ "$CODE" = "401" ]; then echo "functions ready"; exit 0; fi
            sleep 2
          done
          echo "::error::edge functions never came up"; cat /tmp/functions-serve.log; exit 1

      - name: Run worker integration suite
        run: |
          KEY=$(supabase status --output json | jq -r '.SERVICE_ROLE_KEY // .SECRET_KEY // empty')
          if [ -z "$KEY" ] || [ "$KEY" = "null" ]; then
            echo "::error::could not resolve the service key from supabase status; available keys:"
            supabase status --output json | jq 'keys'
            exit 1
          fi
          export ITEST_SERVICE_ROLE_KEY="$KEY"
          npm run test:worker-integration

      - name: Dump serve log on failure
        if: failure()
        run: tail -200 /tmp/functions-serve.log || true

  # Catches Supabase migration problems at REVIEW time instead of at deploy
  # time on main: a duplicate version stamp against the live tip of main
  # (migration-stamp-guard.sh), then ledger drift. No `needs`: it starts the
  # moment the PR run does (~1 min: CLI setup + a dry-run push), so either
  # shows up as a red check while the other jobs are still building. A red drift check also holds
  # the e2e gate (and therefore the preview deploy) closed, and blocks the
  # merge per the repo merge policy. On Dependabot PRs the steps no-op and
  # the job reports success (a job-level skip would hard-fail the e2e gate,
  # which treats non-excluded "skipped" checks as failures): dependabot
  # never writes migrations, and dependabot-triggered runs get Dependabot
  # secrets, not repo secrets, so the check could never link anyway.
  supabase-drift:
    name: Supabase Drift Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: actions/checkout@v7

      # Duplicate version stamps are a RACE between branches, so the tree this
      # PR was branched from cannot show them: the collision only exists once
      # the other branch merges. Comparing against the live tip of main is what
      # turns that into a red PR check instead of a broken main (PRs #600/#601,
      # #932/#934). Runs before the CLI setup because it needs neither the CLI
      # nor the repo secrets, so a collision reports in seconds.
      - name: Guard against duplicate migration version stamps
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: bash .github/scripts/migration-stamp-guard.sh "${{ github.base_ref }}"

      # Same pin as worker-integration: bump deliberately, not implicitly.
      - name: Setup Supabase CLI
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: supabase/setup-cli@v3
        with:
          version: 2.78.1

      - name: Drift check (dry-run push against prod ledger)
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: bash .github/scripts/supabase-deploy.sh check

  # Vercel deploys moved from the git integration into CI (vercel.json sets
  # git.deploymentEnabled: false) so a deployment only happens once the five
  # jobs above are green, not on every single commit. Previews deploy per
  # PR (superseded pushes are cancelled by the concurrency group first);
  # pushes to main deploy production. Remote build (`vercel deploy` without
  # --prebuilt) keeps build env/behavior identical to the old git-triggered
  # builds. The e2e job `needs` this, so the chain is:
  # checks → gate → deploy → live e2e against a commit that actually deploys.
  #
  # On push to main this job ALSO deploys Supabase first: drift check +
  # `db push` + bulk edge-function deploy (see supabase-deploy.sh), as
  # ordered steps BEFORE the Vercel production deploy, so a failed migration
  # blocks the app deploy instead of shipping code whose schema never landed.
  # This replaces the manual post-merge "apply migrations, deploy functions"
  # chores from the README flow.
  #
  # PR deploys run the same e2e-gate as the e2e job first: no preview deploy
  # while Bugbot is NEUTRAL, any cross-workflow check is red, or a review
  # thread is unresolved. Unresolved threads fail the gate immediately:
  # resolve them, then re-run this job (e2e re-runs with it via `needs`).
  # worker-integration is in `needs` (not just the e2e job's) so the gate
  # never has to poll for it: its 25m ceiling would outlast the gate's 20m
  # timeout and fail the deploy on a job that was about to pass. With every
  # same-workflow job covered by `needs`, the gate poll only ever covers
  # cross-workflow checks (CodeQL, audit) and apps (Bugbot, GitGuardian).
  # The 30m budget = gate poll (≤20m) + the deploy itself.
  #
  # On Dependabot PRs every step no-ops and the job reports success: the
  # same pattern as supabase-drift above, for the same two reasons: (1)
  # dependabot-triggered runs get Dependabot secrets, not repo secrets, so
  # VERCEL_TOKEN is empty and the deploy step can only fail; (2) a job-level
  # skip would leave a "skipped" check run, which both the e2e gate and the
  # dependabot auto-merge's strict all-success evaluation treat as NOT
  # passing, so no Dependabot PR could ever auto-merge. Deploy coverage is
  # not lost: dependency bumps get their real deploy from the push-to-main
  # run right after the auto-merge.
  vercel-deploy:
    name: Vercel Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [quality, typecheck, test, deno-check, security, worker-integration]
    permissions:
      # contents: write is for the push-to-main order heal only
      # (migration-order-heal.sh, called inside supabase-deploy.sh deploy):
      # it may push a migration re-stamp commit to main before `db push`.
      # A GITHUB_TOKEN push triggers no new workflow run, so no recursion.
      # PR-event runs of this job never push anything.
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: actions/checkout@v7

      # Push events (post-merge main) skip the PR-shaped gate: Bugbot and
      # review threads exist on the PR, which already enforced this pre-merge.
      - name: Wait for every other check to pass and all threads to resolve
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/e2e-gate.sh

      - name: Setup Supabase CLI
        if: env.MAIN_DEPLOY == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: 2.78.1

      # Order matters: schema first, then functions, then the app build that
      # expects both. `db push` re-runs the same drift guard the PR check did.
      # Before pushing, migration-order-heal.sh re-stamps any not-yet-applied
      # migration that another PR's merge pushed below the applied head (the
      # post-approval merge window), committing the rename to main; that is
      # what the job's contents: write is for.
      - name: Apply migrations + deploy edge functions
        if: env.MAIN_DEPLOY == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          # The order-heal re-stamp push authenticates with a write deploy
          # key: the main ruleset blocks direct pushes and exempts deploy
          # keys (GitHub refuses its own Actions app as a bypass actor on a
          # user-owned repo). See migration-order-heal.sh's header.
          MIGRATION_HEAL_SSH_KEY: ${{ secrets.MIGRATION_HEAL_SSH_KEY }}
          MIGRATION_HEAL_PUSH_URL: git@github.com:${{ github.repository }}.git
        run: bash .github/scripts/supabase-deploy.sh deploy

      - name: Deploy to Vercel
        id: deploy
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not available to this run: cannot deploy."
            exit 1
          fi
          if [ "${{ env.MAIN_DEPLOY }}" = "true" ]; then
            TARGET_FLAG="--prod"
            echo "target=production" >> "$GITHUB_OUTPUT"
          else
            TARGET_FLAG=""
            echo "target=preview" >> "$GITHUB_OUTPUT"
          fi
          URL=$(npx --yes vercel@latest deploy $TARGET_FLAG --yes --token "$VERCEL_TOKEN" | tail -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $URL"
          echo "### Vercel deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"

      # The git integration's bot comment is gone with auto-deploys; keep the
      # preview URL discoverable with one sticky (edited-in-place) PR comment.
      - name: Comment preview URL on the PR
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MARKER="<!-- ci-vercel-preview -->"
          BODY="$MARKER
          **Vercel preview** (deployed by CI after all checks passed): ${{ steps.deploy.outputs.url }}, commit ${{ github.event.pull_request.head.sha }}"
          EXISTING=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --paginate -q ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$EXISTING" -f body="$BODY" > /dev/null
          else
            gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -f body="$BODY" > /dev/null
          fi

  # Live-AI end-to-end suite (tests/e2e/): real Gemini calls exercising the
  # reply-reasoning trailer round trip and full AiFlow executions where the
  # model makes the branch decisions, the contract class that unit tests
  # cannot cover (the Truly Insurance trailer leak of 2026-07-11 shipped
  # through 100%-coverage unit tests because only the live model mangles
  # markers).
  #
  # Runs LAST, twice-gated so the paid model calls fire only on an
  # otherwise-mergeable commit:
  #   1. `needs`: the five check jobs PLUS the Vercel deploy in THIS
  #      workflow (free, event-driven): checks → deploy → e2e;
  #   2. the e2e-gate step: polls until every OTHER check on the SHA,
  #      cross-workflow (Analyze/CodeQL/audit) and app-reported (Cursor
  #      Bugbot, GitGuardian), is literally SUCCESS (a NEUTRAL Bugbot
  #      means open findings and keeps the gate closed) AND every review
  #      thread is resolved. Unresolved threads fail the gate IMMEDIATELY
  #      (they can't self-resolve; re-run the job after resolving them).
  #      See .github/scripts/e2e-gate.sh.
  # Superseded pushes are cancelled by the workflow-level concurrency group.
  #
  # On Dependabot PRs every step no-ops and the job reports success (same
  # pattern and rationale as vercel-deploy above): dependabot-triggered runs
  # get Dependabot secrets, not repo secrets, so GOOGLE_API_KEY is empty
  # and the suite could never run, and a job-level skip would leave a
  # "skipped" check that blocks the strict auto-merge evaluation. The live
  # suite still covers dependency bumps on the push-to-main run post-merge.
  #
  # Spend guard (Jul 2026, scoped): the paid model calls are sized to the
  # change. .github/scripts/e2e-scope.sh maps the diff to the e2e files it
  # can affect: an all-safe diff (docs, admin-only UI, marketing pages,
  # app-UI i18n catalogs, operator scripts, non-e2e tests, repo meta) skips
  # the calls entirely, a single-surface diff runs only that surface's
  # suites, and anything unmapped or erroring runs the FULL suite (fail
  # open). Push-to-main additionally dedupes: when the merge commit's tree
  # is identical to the merged PR head whose e2e check already passed, the
  # paid calls are skipped (dependabot merges excluded: their PR-side e2e
  # is a secretless no-op, so the push run is their real coverage). In
  # every skip/narrow case the job still reports SUCCESS (never a
  # "skipped" check, which the merge policy treats as blocking). The
  # nightly full run (e2e-nightly.yml) catches live-model drift that no
  # diff triggers.
  #
  # Admin cost toggle (Admin → Gemini → "CI live e2e"): when the stored
  # mode is "nightly-only", the scope script skips the paid calls on EVERY
  # per-change run, the nightly cron becomes the only live coverage and
  # emails the admin on failure. Read live from
  # /api/public/ci-e2e-mode with fail-open to per-change.
  e2e:
    name: E2E (live AI + AiFlows)
    runs-on: ubuntu-latest
    # Budget: gate poll (≤20m) + npm ci (~1m) + live suite (~1m nominal,
    # up to ~15m if every serial test rode its full 120s timeout). 40m keeps
    # a worst-case gate from cancelling the job AFTER it opened, which
    # would burn the paid Gemini calls without recording a verdict.
    timeout-minutes: 40
    needs: [quality, typecheck, test, deno-check, security, vercel-deploy, worker-integration]
    permissions:
      contents: read
      checks: read
      statuses: read
      pull-requests: read
    steps:
      - name: Checkout
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: actions/checkout@v7

      # Spend guard: emits `skip` (true = zero paid calls) and `files`
      # ("all" or the scoped tests/e2e list this diff can affect). Fails
      # open (skip=false, files=all) on any listing error. Runs on BOTH
      # events: PRs scope their diff; pushes to main first try the
      # identical-tree dedupe against the merged PR's already-passed e2e,
      # then scope the push diff.
      - name: Decide the e2e scope for this change
        id: aiscope
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ env.MAIN_DEPLOY }}" = "true" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || printf '%s' "$BEFORE" | grep -q '^0*$'; then
              BEFORE=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}" \
                -q '.parents[0].sha' 2>/dev/null || true)
            fi
            bash .github/scripts/e2e-scope.sh push "${{ github.repository }}" \
              "${{ github.sha }}" "${BEFORE:-0000000000000000000000000000000000000000}"
          else
            bash .github/scripts/e2e-scope.sh pr "${{ github.repository }}" \
              "${{ github.event.pull_request.number }}"
          fi

      # Push events (post-merge main) skip the PR-shaped gate: Bugbot/Vercel/
      # threads exist on the PR, which already enforced all of this pre-merge.
      #
      # Deliberately NOT conditioned on the spend guard: the gate is free
      # (GitHub API polling) and it is what makes this job the merge bar:
      # a safe-path skip must only save the PAID model calls below, never
      # let the job go green while other checks fail or threads sit
      # unresolved.
      - name: Wait for every other check to pass and all threads to resolve
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/e2e-gate.sh

      - name: Setup Node.js
        if: >-
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          steps.aiscope.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        if: >-
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          steps.aiscope.outputs.skip != 'true'
        run: npm ci

      # `files=all` (or an unexpectedly empty list, fail open) runs the
      # whole suite; a scoped list is passed to vitest as file filters
      # against the same e2e config.
      - name: Run live e2e suite
        if: >-
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          steps.aiscope.outputs.skip != 'true'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          E2E_FILES: ${{ steps.aiscope.outputs.files }}
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "::error::GOOGLE_API_KEY secret is not available to this run: the e2e suite cannot call Gemini."
            exit 1
          fi
          if [ "$E2E_FILES" = "all" ] || [ -z "$E2E_FILES" ]; then
            npm run test:e2e
          else
            npx vitest run --config vitest.e2e.config.ts $E2E_FILES
          fi

      # Billed-token accounting for the paid calls above, so per-run spend
      # is visible in the job summary and reconcilable against AI Studio's
      # per-key view + /admin/gemini (docs/GEMINI-SPEND.md).
      - name: Report Gemini token usage
        if: >-
          always() &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          steps.aiscope.outputs.skip != 'true'
        run: bash .github/scripts/e2e-usage-summary.sh

  # Tell IndexNow (and therefore Bing, and therefore ChatGPT search) that the
  # public pages just changed, instead of waiting for the next crawl.
  #
  # A SEPARATE job rather than a step in vercel-deploy, on purpose:
  # main-failure-watch.yml keys its wording off the "Vercel Deploy" job's
  # conclusion and emails "production did not update" when the workflow
  # fails. A failing step in that job would page a human with the wrong
  # message over a search-engine notification. This job cannot fail at all
  # (the script always exits 0) and blocks nothing.
  #
  # No new secret: the IndexNow key is PUBLIC by protocol design, served at
  # /indexnow-key.txt for the engines to verify ownership, so the script
  # reads it off the live site. Unset there = feature off = no-op.
  # The push-only condition is on every STEP, never on the job. A job-level
  # `if` reports the check as "skipped", which the merge policy treats as
  # blocking and which fails the e2e gate ("e2e gate: check(s) failed,
  # IndexNow ping"). Same reason vercel-deploy and e2e gate step-by-step.
  # The job must always run and always report SUCCESS; on a PR every step
  # below no-ops.
  indexnow-ping:
    name: IndexNow ping
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [vercel-deploy]
    permissions:
      contents: read
    steps:
      - name: Checkout
        if: env.MAIN_DEPLOY == 'true'
        uses: actions/checkout@v7

      - name: Setup Node
        if: env.MAIN_DEPLOY == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        if: env.MAIN_DEPLOY == 'true'
        run: npm ci

      # The compare API rather than a git diff: the checkout is shallow, and
      # deepening it here would repeat the mistake #944 fixed. Same source
      # e2e-scope.sh uses, including its force-push shape (an all-zero
      # before-SHA) and the 300-file cap on .files.
      #
      # FAIL CLOSED, with one documented exception. Any error emits an empty
      # list and the script skips on an empty list: missing a ping costs a few
      # days of latency (the weekly auto-post re-submits the sitemap anyway),
      # while announcing every URL on every backend-only deploy is the
      # behavior IndexNow asks us not to have. The exception is the 300-file
      # cap below, where a false gate reading is likelier than a true one.
      - name: Announce changed public pages
        # Production deploys only: a preview must never announce production URLs.
        if: env.MAIN_DEPLOY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          BEFORE="${BEFORE:-}"
          if [ -z "$BEFORE" ] || printf '%s' "$BEFORE" | grep -q '^0*$'; then
            BEFORE=$(gh api "repos/$REPO/commits/$SHA" -q '.parents[0].sha' 2>/dev/null || true)
          fi
          changed=""
          if printf '%s' "$BEFORE" | grep -qv '^0*$'; then
            changed=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" \
              -q '.files[].filename' 2>/dev/null) || changed=""
          fi
          if [ -z "$changed" ]; then
            echo "IndexNow: no usable changed-file list (new branch, force push, or API error), skipping." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The ONE case that fails open. `.files` is capped at 300, so a
          # bigger push returns a slice: the gate could read false purely
          # because the public files landed outside it. A 300-file push is
          # more likely to touch public pages, not less, and over-announcing
          # once on a giant release is cheaper than silently skipping it.
          count=$(printf '%s\n' "$changed" | wc -l | tr -d ' ')
          if [ "$count" -ge 300 ]; then
            echo "IndexNow: compare API capped at ${count} files, assuming public pages changed." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            npx tsx scripts/indexnow-submit.ts --all
            exit 0
          fi
          printf '%s\n' "$changed" | npx tsx scripts/indexnow-submit.ts --changed --stdin
