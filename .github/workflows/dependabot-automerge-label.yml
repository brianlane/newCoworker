name: Dependabot automerge label

# Tags a Dependabot PR as eligible for auto-merge, for patch and minor updates
# ONLY. Majors are deliberately left unlabelled so a human merges them.
#
# This used to label everything, majors included, on the theory that the merger
# is the real gate: dependabot-automerge.yml only merges once EVERY CI check is
# green with no unresolved review threads, so "a major bump that breaks CI can
# never be auto-merged". That reasoning has a hole. It assumes a breaking major
# always breaks CI, and a major is precisely the bump where that assumption
# fails.
#
# The case that exposed it: mcp-handler 1.1.0 -> 2.1.0 (PR #1178) did not merely
# bump a version, it swapped the underlying implementation, moving the peer
# dependency from @modelcontextprotocol/sdk to @modelcontextprotocol/server.
# Among other things that relocated the verified OAuth caller from
# `extra.authInfo` to `ctx.http.authInfo`. Our code read the old path through an
# `unknown` cast, so that specific break type-checks clean and merely fails
# every MCP tool call closed at runtime. CI happened to catch a DIFFERENT error
# in the same PR (a changed createMcpHandler arity). Had the arity been
# unchanged, a green CI would have auto-merged a silently broken production
# OAuth endpoint with no human ever reading the diff.
#
# So: CI is necessary but not sufficient for a major. Majors now get a
# `dependabot-major-review` label for visibility and wait for a person. This
# also makes the merger's own "lacks the label (major update)" branch true,
# which it had not been since this workflow started labelling everything.
#
# Split into two workflows because:
#   - This one needs write access to label, which requires pull_request_target
#     (Dependabot's pull_request token is read-only).
#   - The strict "all checks green" evaluation must run AFTER CI finishes, which
#     is handled via workflow_run in the companion file.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependabot-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label-dependabot:
    name: label-dependabot
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply the label this update type earns
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without a checkout there is no git context, so gh cannot infer the
          # repo. GH_REPO makes `gh label create` (and friends) target this repo
          # directly; without it label creation fails and add-label errors with
          # "'dependabot-automerge' not found".
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          set -euo pipefail

          # Ensure both labels exist (idempotent).
          gh label create dependabot-automerge \
            --color 0e8a16 \
            --description "Dependabot PR eligible for strict auto-merge" \
            --force
          gh label create dependabot-major-review \
            --color d93f0b \
            --description "Major Dependabot update: needs a human review before merge" \
            --force

          echo "Dependabot update type: ${UPDATE_TYPE:-<none>}"

          # For a grouped update, fetch-metadata reports the HIGHEST semver
          # change in the group, so a single major holds the whole group back.
          # That is intended: a group lands as one commit, so it is only as
          # safe to auto-merge as its riskiest member.
          # Only patch/minor earns the auto-merge label. Everything else, a
          # major OR an update-type we could not read, takes the same
          # fail-closed path, so the two cannot drift apart: an earlier
          # version of this file flagged unknown types for review but forgot
          # to strip an already-applied auto-merge label, leaving them
          # eligible for the merger anyway.
          case "${UPDATE_TYPE:-}" in
            version-update:semver-minor|version-update:semver-patch)
              echo "Patch/minor update: eligible for auto-merge (the merger still requires all checks green)."
              gh pr edit "$PR_URL" --add-label "dependabot-automerge"
              ;;
            *)
              if [ "${UPDATE_TYPE:-}" = "version-update:semver-major" ]; then
                echo "Major update: withholding auto-merge, flagging for human review."
              else
                echo "Unrecognised update type '${UPDATE_TYPE:-<none>}'; withholding auto-merge."
              fi
              gh pr edit "$PR_URL" --add-label "dependabot-major-review"
              # Strip the auto-merge label in case an earlier run applied it:
              # this workflow re-runs on synchronize, and a PR may predate this
              # policy or have been labelled before its type became readable.
              # Removing an absent label is not worth failing the job over.
              gh pr edit "$PR_URL" --remove-label "dependabot-automerge" || true
              ;;
          esac
