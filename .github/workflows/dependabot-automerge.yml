name: Dependabot auto-merge

# Strictly merges an eligible Dependabot PR only when EVERY check run for the
# head commit concluded "success" AND there are no unresolved review threads
# (e.g. Bugbot or human comments). Any failed / cancelled / timed_out / neutral
# / skipped / action_required check blocks the merge.
#
# Runs after CI finishes (workflow_run) so we never sit on an idle runner
# polling. If a check is still in progress when this fires, it exits quietly and
# is re-triggered when the next workflow completes.
#
# Also runs on commit `status` events: Vercel reports its deployment as a
# legacy commit status, which often flips to success minutes AFTER the last CI
# workflow completes. Without this trigger the final workflow_run evaluation
# sees state=pending, skips, and nothing ever re-evaluates the PR.
#
# Finally, it runs on a schedule as a self-healing sweep. Every other trigger is
# edge-driven: it fires once, and if that single attempt does not merge, nothing
# ever revisits the PR. That is not hypothetical. PR #1173 went fully green,
# this workflow evaluated it, passed every gate, called the merge, and lost an
# optimistic-concurrency race:
#
#     GraphQL: Base branch was modified. Review and try the merge again.
#
# Three Dependabot PRs finished CI within four seconds of each other; two merged
# and moved main out from under the third. No further checks would ever run on
# #1173, so no further workflow_run or status event could ever re-trigger it,
# and it sat green and unmerged until a human noticed. Two defenses below:
# merge_with_retry re-attempts the race directly, and the scheduled sweep
# re-evaluates every eligible PR regardless of what event was missed or lost.

on:
  workflow_run:
    workflows: ["CI", "CodeQL", "Dependency Audit"]
    types: [completed]
  status:
  schedule:
    # Hourly sweep. Cheap (one API-only job, no checkout, no build) and it
    # bounds how long a PR can sit green-but-unmerged after a lost trigger.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # For status events we can't filter on branch here: the payload's
    # `branches` array is often empty (e.g. commits pushed to an existing
    # branch), so the job runs for every successful status and the script's
    # PR-lookup / dependabot-author / label guards exit quietly when the
    # status is unrelated to an eligible Dependabot PR.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       startsWith(github.event.workflow_run.head_branch, 'dependabot/')) ||
      (github.event_name == 'status' &&
       github.event.state == 'success') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Evaluate checks and merge if all green
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          # workflow_run events carry head_sha/head_branch; status events only
          # carry the commit sha, so the script resolves the PR from the sha.
          # Both are empty on schedule/workflow_dispatch, which sweep instead.
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.event.sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REQUIRED_LABEL: dependabot-automerge
          # Checks to ignore in the strict evaluation:
          #   label-dependabot -> this repo's own automerge labeler job
          #   cursor-auto-merge -> Cloud Agent merger, skipped on Dependabot PRs
          EXCLUDE_CHECKS: '["label-dependabot", "cursor-auto-merge"]'
        run: |
          set -euo pipefail

          # ---------------------------------------------------------------
          # Merge, retrying only the optimistic-concurrency race.
          #
          # "Base branch was modified" means main moved between our read and
          # our write. It says nothing about whether this PR is mergeable, so
          # it is safe (and necessary) to retry. Every other merge error is a
          # real refusal and must not be retried.
          # ---------------------------------------------------------------
          merge_with_retry() {
            local pr="$1"
            local attempt=1
            local max=5
            local out state

            while [ "$attempt" -le "$max" ]; do
              if out=$(gh pr merge "$pr" --repo "$REPO" --squash --delete-branch 2>&1); then
                echo "Merged PR #$pr (attempt $attempt/$max)."
                return 0
              fi

              echo "Merge attempt $attempt/$max for PR #$pr failed: $out"

              case "$out" in
                *"Base branch was modified"*|*"try the merge again"*|*"not mergeable"*)
                  : # retryable race
                  ;;
                *)
                  echo "Non-retryable merge error; leaving PR #$pr for a human."
                  return 1
                  ;;
              esac

              # Someone else may have merged or closed it while we backed off.
              # Only a DEFINITE non-open state ends the loop successfully: if
              # this read fails we must keep retrying rather than report a
              # merge that never happened. A skip must never read as done.
              state=$(gh pr view "$pr" --repo "$REPO" --json state --jq '.state' 2>/dev/null || echo "UNKNOWN")
              case "$state" in
                MERGED|CLOSED)
                  echo "PR #$pr is now $state; nothing left to retry."
                  return 0
                  ;;
                OPEN)
                  : # still ours to merge
                  ;;
                *)
                  echo "Could not read PR #$pr state (got '${state:-<empty>}'); assuming still open and retrying."
                  ;;
              esac

              sleep $(( attempt * 5 ))
              attempt=$(( attempt + 1 ))
            done

            echo "Exhausted $max merge attempts for PR #$pr; the next sweep will retry."
            return 1
          }

          # ---------------------------------------------------------------
          # Evaluate one PR against the strict gate, and merge it if it passes.
          # Returns 0 for "handled" (merged, or deliberately skipped) and 1 only
          # when a merge was warranted but could not be completed.
          # ---------------------------------------------------------------
          evaluate_pr() {
            local pr="$1"
            local pr_json cur_sha state author is_draft has_label
            local checks filtered incomplete not_success
            local status_json status_total status_state unresolved

            pr_json=$(gh pr view "$pr" --repo "$REPO" \
              --json headRefOid,state,author,labels,isDraft)
            cur_sha=$(echo "$pr_json"   | jq -r '.headRefOid')
            state=$(echo "$pr_json"     | jq -r '.state')
            author=$(echo "$pr_json"    | jq -r '.author.login')
            is_draft=$(echo "$pr_json"  | jq -r '.isDraft')
            has_label=$(echo "$pr_json" | jq -r --arg l "$REQUIRED_LABEL" \
              'any(.labels[]?; .name == $l)')

            [ "$state" = "OPEN" ]     || { echo "PR #$pr is $state; skipping."; return 0; }
            [ "$is_draft" = "false" ] || { echo "PR #$pr is a draft; skipping."; return 0; }
            # gh reports the Dependabot bot login as "dependabot[bot]" in webhook
            # payloads but as "app/dependabot" via `gh pr view --json author`.
            # Accept both so the guard works regardless of gh's representation.
            case "$author" in
              "dependabot[bot]"|"app/dependabot") ;;
              *) echo "PR #$pr author is $author; skipping."; return 0 ;;
            esac
            # Majors are deliberately withheld from the label by
            # dependabot-automerge-label.yml and must be merged by a human.
            [ "$has_label" = "true" ] || { echo "PR #$pr lacks '$REQUIRED_LABEL' (major update, or not yet labeled); skipping."; return 0; }

            # Guard against a stale event: only act on checks for the current
            # head. Sweeps carry no event sha and always use the PR's own head.
            if [ -n "${HEAD_SHA:-}" ] && [ "$EVENT_NAME" != "schedule" ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
              if [ "$cur_sha" != "$HEAD_SHA" ]; then
                echo "Stale run: PR #$pr head moved ($HEAD_SHA -> $cur_sha); skipping."
                return 0
              fi
            fi

            echo "Evaluating check runs for PR #$pr at $cur_sha ..."
            checks=$(gh api --paginate "repos/$REPO/commits/$cur_sha/check-runs" \
              --jq '.check_runs[] | {name, status, conclusion}')

            filtered=$(echo "$checks" | jq -c --argjson ex "$EXCLUDE_CHECKS" \
              'select((.name) as $n | ($ex | index($n)) | not)')

            if [ -z "$filtered" ]; then
              echo "No relevant check runs found for PR #$pr; refusing to merge."
              return 0
            fi

            echo "Relevant checks:"
            echo "$filtered" | jq -r '"  - \(.name): \(.status)/\(.conclusion // "n/a")"'

            incomplete=$(echo "$filtered" | jq -rc 'select(.status != "completed")')
            if [ -n "$incomplete" ]; then
              echo "PR #$pr still has checks running; will re-evaluate when they finish."
              return 0
            fi

            # Strict gate: every remaining check must have concluded success.
            not_success=$(echo "$filtered" | jq -rc 'select(.conclusion != "success")')
            if [ -n "$not_success" ]; then
              echo "Strict gate failed for PR #$pr -- not green (success):"
              echo "$not_success" | jq -r '"  - \(.name): \(.conclusion // "n/a")"'
              return 0
            fi

            # Also honor any legacy commit statuses (non-check-run integrations).
            status_json=$(gh api "repos/$REPO/commits/$cur_sha/status" \
              --jq '{state: .state, total: .total_count}')
            status_total=$(echo "$status_json" | jq -r '.total')
            status_state=$(echo "$status_json" | jq -r '.state')
            if [ "$status_total" -gt 0 ] && [ "$status_state" != "success" ]; then
              echo "PR #$pr commit statuses not all green (state=$status_state); skipping."
              return 0
            fi

            # Policy gate: no unresolved review threads (e.g. Bugbot / human comments).
            unresolved=$(gh api graphql -f query='
              query($owner:String!, $repo:String!, $pr:Int!) {
                repository(owner:$owner, name:$repo) {
                  pullRequest(number:$pr) {
                    reviewThreads(first:100) { nodes { isResolved } }
                  }
                }
              }' -F owner="${REPO%/*}" -F repo="${REPO#*/}" -F pr="$pr" \
              --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')
            if [ "$unresolved" -gt 0 ]; then
              echo "PR #$pr has $unresolved unresolved review thread(s); skipping per merge policy."
              return 0
            fi

            echo "All checks green and no unresolved threads. Squash-merging PR #$pr."
            merge_with_retry "$pr"
          }

          # ---------------------------------------------------------------
          # Resolve which PRs this run should consider.
          # ---------------------------------------------------------------
          PR_NUMBERS=""
          case "$EVENT_NAME" in
            schedule|workflow_dispatch)
              # Self-healing sweep: every open, labeled Dependabot PR, whatever
              # event was missed, cancelled, or lost to a merge race.
              PR_NUMBERS=$(gh pr list --repo "$REPO" --state open \
                --label "$REQUIRED_LABEL" --limit 100 \
                --json number,author \
                --jq '.[] | select(.author.login == "app/dependabot" or .author.login == "dependabot[bot]") | .number')
              echo "Sweep: considering PR(s): ${PR_NUMBERS:-<none>}"
              ;;
            *)
              if [ -n "${HEAD_BRANCH:-}" ]; then
                PR_NUMBERS=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" \
                  --state open --json number --jq '.[0].number // empty')
              else
                # status event: the payload has no branch, so find the open PR
                # whose head commit is this sha. The endpoint lists every PR
                # associated with the commit, so filter to PRs headed by it.
                PR_NUMBERS=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" |
                  jq -r --arg sha "$HEAD_SHA" \
                    '[.[] | select(.state == "open" and .head.sha == $sha)][0].number // empty')
              fi
              ;;
          esac

          if [ -z "$PR_NUMBERS" ]; then
            echo "No candidate PRs for $EVENT_NAME (sha: ${HEAD_SHA:-<none>}, branch: ${HEAD_BRANCH:-<none>}); nothing to do."
            exit 0
          fi

          FAILED=0
          for pr in $PR_NUMBERS; do
            echo "::group::PR #$pr"
            evaluate_pr "$pr" || FAILED=1
            echo "::endgroup::"
          done

          exit "$FAILED"
