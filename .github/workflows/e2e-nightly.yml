name: E2E Nightly

# The full live-AI suite on main, scheduled once a day but only executed when
# main has received a merged PR since the previous completed nightly run (or
# the previous suite job failed and needs a retry). Manual workflow_dispatch
# always runs. This is the safety net for the CI spend guard (ci.yml e2e job
# + e2e-scope.sh): PR and push runs scope or skip paid Gemini calls based on
# the diff, so a merge that ships AI-path changes still gets a full live
# suite on the next nightly. Quiet nights with no merges skip the paid
# calls. Live-model drift with zero code change waits until the next merge
# night or a manual dispatch.
#
# Not part of any merge gate: a red nightly is an investigate-now signal
# (model drift or a flaky contract), not a blocked PR.
#
# When the Admin → Gemini "CI live e2e" toggle is set to nightly-only,
# this run (when it executes) is the ONLY live-AI coverage, so a failure
# emails the admin (team@newcoworker.com via Resend, the RESEND_API_KEY
# repo secret). Success stays silent by design.

on:
  schedule:
    # 09:30 UTC ≈ 2:30am Pacific, quiet hours for both CI load and the
    # Gemini rate-limit footprint.
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: "24"
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "true"

jobs:
  should-run:
    name: Decide whether to run nightly e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      # Checkout only to load the gate script; no npm. Fail-open lives in
      # the script so an API blip still pays for a suite rather than
      # silently dropping coverage.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Gate on merges into main since last nightly
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: bash .github/scripts/e2e-nightly-gate.sh

  e2e-full:
    name: E2E full suite (nightly)
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # One built-in re-run before the job goes red: a single live-model
      # wobble (temperature-0 draws still vary run to run) must not page the
      # admin at 2:30am. A REAL regression fails both passes: the email
      # only fires when the failure reproduces back-to-back. Doubles the
      # paid calls only on failing nights, which is exactly when the spend
      # is worth it.
      - name: Run full live e2e suite (one retry before alerting)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "::error::GOOGLE_API_KEY secret is not available to this run; the e2e suite cannot call Gemini."
            exit 1
          fi
          if npm run test:e2e; then exit 0; fi
          echo "::warning::First pass failed; re-running once to separate a model wobble from real drift."
          npm run test:e2e

      - name: Report Gemini token usage
        if: always()
        run: bash .github/scripts/e2e-usage-summary.sh

      # Failure-only admin notification: with the per-change suite toggled
      # off, nobody is watching PR checks for AI regressions; this email is
      # the alerting path. A missing secret degrades to a loud log line (the
      # job is already red; never mask WHY it is red with a notify error).
      - name: Email the admin on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::warning::RESEND_API_KEY secret is not set; cannot email the admin about this failure. Set it (gh secret set RESEND_API_KEY) or watch the Actions tab."
            exit 0
          fi
          BODY=$(jq -n --arg url "$RUN_URL" '{
            from: "New Coworker <contact@newcoworker.com>",
            to: ["team@newcoworker.com"],
            subject: "Nightly live e2e FAILED: AI behavior may have drifted",
            text: ("The nightly full live-AI e2e suite failed.\n\nRun: " + $url + "\n\nThis suite is the merge-gated live-model drift check (and, when the admin CI e2e toggle is nightly-only, the ONLY live coverage). Read the failed job log; the failing test names the contract that broke. If it is a one-off model wobble, re-run the workflow; if it repeats, treat it as a live regression.\n\n- CI (e2e-nightly.yml)")
          }')
          curl -fsS https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$BODY" > /dev/null && echo "Failure email sent to team@newcoworker.com" || \
            echo "::warning::Failure email could not be sent (Resend API error); check the Actions tab."
