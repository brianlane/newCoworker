name: Main Failure Watch

# Why: a failed push-to-main CI run means PRODUCTION NEVER GOT THE DEPLOY
# (migrations, edge functions, and the Vercel app all ride the Vercel Deploy
# job), and before this workflow nothing retried or told anyone, the
# 2026-07-23 incident was a transient Supabase-CLI container error
# ("error running container: exit 135") that sat unnoticed until a human
# happened to look at the Actions tab.
#
# Policy, mirroring the nightly e2e's noise discipline. The decision lives in
# .github/scripts/main-failure-triage.sh, which is covered by
# tests/main-failure-triage.test.ts:
#   - attempt 1 fails → re-run ONLY the failed jobs automatically (plus their
#     dependents, GitHub re-runs the skipped downstream chain). Transient
#     runner/CLI blips self-heal with zero human involvement.
#   - attempt 2 fails the SAME way → real: email the admin with the run link,
#     no extra delay.
#   - attempt 2 fails a DIFFERENT way → two unrelated blips, not one bug:
#     re-run once more before waking anyone.
#   - attempt 3+ fails → email whatever the causes.
#   - success at any point → silence.
#
# The old rule stopped at "failed twice, therefore real", which assumes the
# same cause reproduced. On 2026-08-06 two unrelated transient Supabase
# failures 30 seconds apart were reported as one real bug, and a human ran the
# attempt 3 that went green. See the script header for the full case.
#
# Scope: production-deploy CI runs on main. That is a `push` to main, or a
# `workflow_dispatch` on main (Cloud Agent automerge: GITHUB_TOKEN squash-
# merges do not emit a push event, so CI is dispatched). PR-run failures
# are excluded on purpose: they are watched by whoever is babysitting the
# PR (per the repo merge flow) and block nothing in production.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  # actions: write to re-run the failed jobs. contents: read is what lets
  # actions/checkout fetch the triage script: an explicit permissions block
  # DENIES every scope it omits, so leaving it out does not fall back to a
  # default, it fails the checkout and the job never gets as far as retrying
  # or alerting. This workflow needed no checkout until the logic moved into
  # .github/scripts/main-failure-triage.sh, which is why it is the only
  # workflow here that was missing it.
  actions: write
  contents: read

jobs:
  triage:
    name: Retry, then alert
    # Only failed production-deploy CI runs on main; PR runs are out of scope.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Retry or alert, based on whether the failures match
        env:
          GH_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/main-failure-triage.sh
