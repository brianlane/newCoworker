name: restore-outreach-sweep-once
on:
  push:
    branches: [cursor/outreach-intl-contacted-stage]
    paths:
      - "tests/.restore/**"
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/outreach-intl-contacted-stage
      - name: Decode gunzip and commit restored test
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          a = Path("tests/.restore/b64_a.txt").read_text().strip()
          b = Path("tests/.restore/b64_b.txt").read_text().strip()
          data = gzip.decompress(base64.b64decode(a + b))
          assert len(data) > 100000
          assert data.startswith(b"/**")
          assert b"ask front desk" in data
          Path("tests/outreach-sweep.test.ts").write_bytes(data)
          print("restored_bytes", len(data))
          PY
          rm -rf tests/.restore
          rm -f .github/workflows/restore-outreach-sweep-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/outreach-sweep.test.ts
          git add -u
          git commit -m "Restore outreach-sweep tests and cover storedProspectPhone unparseable fallback."
          git push
